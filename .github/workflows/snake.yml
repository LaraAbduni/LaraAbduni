name: Generate contribution snake

"on":
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches-ignore:
      - output

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6D5DFB&color_dots=#EBEDF0,#D8D3FF,#B8AEFF,#8F80F2,#5B4ACB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A99BFF&color_dots=#161B22,#27223D,#4A3F72,#7565B8,#A99BFF

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}